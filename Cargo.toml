[package]
name = "leptos-typeahead"
version = "0.0.1"
edition = "2024"
description = "A themeable, accessible typeahead/autocomplete component for Leptos"
license = "MIT"
readme = "README.md"
keywords = ["leptos", "typeahead", "autocomplete", "combobox", "wasm"]
categories = ["wasm", "gui"]

[dependencies]
leptos = "0.8"
gloo-timers = { version = "0.3", features = ["futures"] }
unicode-normalization = "0.1"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlStyleElement",
    "Node",
    "Window",
] }
